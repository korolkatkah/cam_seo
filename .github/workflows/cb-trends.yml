name: CB Trends Collector

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cb-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore raw snapshot window
        uses: actions/cache@v4
        with:
          path: .cache/cb-raw.jsonl
          key: cb-raw-${{ github.run_id }}
          restore-keys: |
            cb-raw-

      - name: Collect snapshot and rebuild summary
        env:
          CB_WM: ${{ secrets.CB_WM }}
        run: python3 scripts/cb_trends.py

      - name: Commit updated summary
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -ge 15 ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "collected snapshot, deferring commit/deploy to the top-of-hour run (minute=$MIN)"
            exit 0
          fi
          git config user.name "cb-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/cb-trends.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update cb trends data"
            git push
          fi
