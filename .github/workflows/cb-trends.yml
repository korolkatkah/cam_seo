name: CB Trends Collector

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cb-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore raw snapshot window
        uses: actions/cache@v4
        with:
          path: .cache/cb-raw.jsonl
          key: cb-raw-${{ github.run_id }}
          restore-keys: |
            cb-raw-

      - name: Collect snapshot and rebuild summary
        env:
          CB_WM: ${{ secrets.CB_WM }}
        run: python3 scripts/cb_trends.py

      - name: Commit updated summary
        run: |
          MIN=$(date -u +%M)
          STALE_SEC=$(python3 -c "import json,sys; from datetime import datetime, timezone; d=json.load(open('src/data/cb-trends.json', encoding='utf-8')); g=datetime.strptime(d['generated_at'], '%Y-%m-%dT%H:%M:%SZ').replace(tzinfo=timezone.utc); print(int((datetime.now(timezone.utc) - g).total_seconds()))" 2>/dev/null || echo 999999)
          if [ "$MIN" -ge 15 ] && [ "$STALE_SEC" -lt 4500 ]; then
            echo "collected snapshot, deferring commit/deploy to the top-of-hour run (minute=$MIN, published data is ${STALE_SEC}s old)"
            exit 0
          fi
          git config user.name "cb-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/cb-trends.json src/data/cb-live.json
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: update cb trends data"
          n=0
          until git push; do
            n=$((n + 1))
            if [ "$n" -ge 5 ]; then
              echo "push failed after $n attempts" >&2
              exit 1
            fi
            echo "push rejected (attempt $n) — rebasing onto latest and retrying"
            git fetch origin main
            git rebase origin/main
            sleep $((n * 3))
          done
