name: SC Trends Collector

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sc-trends
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore raw snapshot window
        uses: actions/cache@v4
        with:
          path: .cache/sc-raw.jsonl
          key: sc-raw-${{ github.run_id }}
          restore-keys: |
            sc-raw-

      - name: Collect snapshot and rebuild summary
        env:
          SC_USER_ID: ${{ secrets.SC_USER_ID }}
        run: python3 scripts/sc_trends.py

      - name: Commit updated summary
        run: |
          MIN=$(date -u +%M)
          if [ "$MIN" -ge 15 ]; then
            echo "collected snapshot, deferring commit/deploy to the top-of-hour run (minute=$MIN)"
            exit 0
          fi
          git config user.name "sc-trends-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/sc-trends.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update sc trends data"
            git push
          fi
