<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Global webcam model and studio promotion agency dashboard illustration">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- monitor -->
  <rect x="140" y="70" width="360" height="230" rx="14" fill="none" stroke="#57534E" stroke-width="2.5"/>
  <rect x="164" y="94" width="312" height="150" rx="6" fill="none" stroke="#A8A29E" stroke-width="2"/>
  <rect x="270" y="300" width="100" height="14" rx="4" fill="#292420"/>
  <rect x="290" y="314" width="60" height="10" rx="4" fill="#1C1917"/>
  <!-- live signal dot -->
  <circle cx="196" cy="118" r="6" fill="#D97706"/>
  <text x="212" y="123" font-family="sans-serif" font-size="14" fill="#D97706" font-weight="700">LIVE</text>
  <!-- rising bars (traffic growth) -->
  <rect x="200" y="200" width="26" height="40" rx="3" fill="url(#g1)"/>
  <rect x="238" y="175" width="26" height="65" rx="3" fill="url(#g1)"/>
  <rect x="276" y="150" width="26" height="90" rx="3" fill="url(#g1)"/>
  <rect x="314" y="120" width="26" height="120" rx="3" fill="url(#g1)"/>
  <rect x="352" y="160" width="26" height="80" rx="3" fill="#57534E" opacity="0.6"/>
  <!-- viewer dots / audience -->
  <circle cx="410" cy="230" r="6" fill="#FAFAF9" opacity="0.85"/>
  <circle cx="428" cy="215" r="6" fill="#FAFAF9" opacity="0.65"/>
  <circle cx="410" cy="200" r="6" fill="#FAFAF9" opacity="0.45"/>
  <circle cx="428" cy="185" r="6" fill="#FAFAF9" opacity="0.3"/>
  <!-- network / global reach nodes -->
  <g stroke="#57534E" stroke-width="1.5" opacity="0.7">
    <line x1="60" y1="60" x2="140" y2="110"/>
    <line x1="60" y1="60" x2="90" y2="150"/>
    <line x1="580" y1="80" x2="500" y2="120"/>
    <line x1="580" y1="80" x2="560" y2="160"/>
    <line x1="90" y1="150" x2="140" y2="200"/>
    <line x1="560" y1="160" x2="500" y2="220"/>
  </g>
  <g fill="#D97706">
    <circle cx="60" cy="60" r="5"/>
    <circle cx="90" cy="150" r="4"/>
    <circle cx="580" cy="80" r="5"/>
    <circle cx="560" cy="160" r="4"/>
  </g>
  <g fill="#F59E0B">
    <circle cx="140" cy="200" r="4"/>
    <circle cx="500" cy="220" r="4"/>
  </g>
</svg>
