    <circle cx="50" cy="150" r="6"/>
    <circle cx="50" cy="210" r="6"/>
    <circle cx="50" cy="270" r="6"/>
  </g>
  <!-- arrowheads -->
  <g fill="#F59E0B">
    <path d="M318 96 L332 100 L318 106 Z"/>
    <path d="M318 111 L332 115 L318 121 Z"/>
    <path d="M318 211 L332 215 L318 221 Z"/>
    <path d="M318 216 L332 220 L318 226 Z"/>
  </g>
