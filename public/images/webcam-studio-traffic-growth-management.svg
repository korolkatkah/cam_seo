<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Webcam studio traffic growth and multi-model management dashboard">
  <!-- 4 room/model panels -->
  <g stroke="#57534E" stroke-width="2.5" fill="none">
    <rect x="330" y="60" width="120" height="90" rx="8"/>
    <rect x="470" y="60" width="120" height="90" rx="8"/>
    <rect x="330" y="170" width="120" height="90" rx="8"/>
    <rect x="470" y="170" width="120" height="90" rx="8"/>
  </g>
  <circle cx="390" cy="105" r="18" fill="none" stroke="#FAFAF9" stroke-width="3"/>
  <circle cx="530" cy="105" r="18" fill="none" stroke="#FAFAF9" stroke-width="3"/>
  <circle cx="390" cy="215" r="18" fill="none" stroke="#FAFAF9" stroke-width="3"/>
  <circle cx="530" cy="215" r="18" fill="none" stroke="#FAFAF9" stroke-width="3"/>
  <g fill="#D97706">
