<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparing Chaturbate, Stripchat, LiveJasmin and BongaCams platform strategy">
  <!-- 4 platform cards -->
  <g stroke="#57534E" stroke-width="2.5" fill="none">
    <rect x="55" y="110" width="120" height="150" rx="12"/>
    <rect x="195" y="90" width="120" height="170" rx="12"/>
    <rect x="335" y="90" width="120" height="170" rx="12"/>
    <rect x="475" y="110" width="120" height="150" rx="12"/>
  </g>
  <!-- token coin icon (Chaturbate) -->
  <circle cx="115" cy="160" r="22" fill="none" stroke="#D97706" stroke-width="3"/>
  <text x="115" y="167" font-family="sans-serif" font-size="18" fill="#D97706" font-weight="700" text-anchor="middle">C</text>
  <line x1="80" y1="210" x2="150" y2="210" stroke="#292420" stroke-width="4"/>
  <line x1="80" y1="225" x2="130" y2="225" stroke="#292420" stroke-width="4"/>
  <!-- VR headset icon (Stripchat) -->
  <rect x="225" y="140" width="60" height="30" rx="10" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <circle cx="240" cy="155" r="7" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <circle cx="270" cy="155" r="7" fill="none" stroke="#F59E0B" stroke-width="2.5"/>
  <line x1="220" y1="210" x2="290" y2="210" stroke="#292420" stroke-width="4"/>
  <line x1="220" y1="225" x2="270" y2="225" stroke="#292420" stroke-width="4"/>
  <!-- premium crown icon (LiveJasmin) -->
  <path d="M365 165 L378 135 L395 158 L412 130 L425 165 Z" fill="none" stroke="#FAFAF9" stroke-width="3" stroke-linejoin="round"/>
  <line x1="360" y1="210" x2="430" y2="210" stroke="#292420" stroke-width="4"/>
  <line x1="360" y1="225" x2="410" y2="225" stroke="#292420" stroke-width="4"/>
  <!-- region/globe icon (BongaCams) -->
  <circle cx="535" cy="160" r="24" fill="none" stroke="#A8A29E" stroke-width="3"/>
  <ellipse cx="535" cy="160" rx="24" ry="10" fill="none" stroke="#A8A29E" stroke-width="2"/>
  <line x1="511" y1="160" x2="559" y2="160" stroke="#A8A29E" stroke-width="2"/>
  <line x1="500" y1="210" x2="570" y2="210" stroke="#292420" stroke-width="4"/>
  <line x1="500" y1="225" x2="550" y2="225" stroke="#292420" stroke-width="4"/>
  <!-- connecting compare line -->
  <path d="M175 320 C260 340 380 340 475 320" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
</svg>
