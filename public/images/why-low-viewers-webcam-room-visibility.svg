<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Why a webcam room has low viewers — visibility comparison illustration">
  <!-- dim room (low visibility) -->
  <rect x="90" y="120" width="180" height="150" rx="12" fill="none" stroke="#3A3532" stroke-width="2.5"/>
  <circle cx="180" cy="175" r="22" fill="none" stroke="#3A3532" stroke-width="3"/>
  <g fill="#3A3532">
    <circle cx="140" cy="235" r="5"/>
  </g>
  <text x="180" y="300" font-family="sans-serif" font-size="14" fill="#57534E" text-anchor="middle">Few viewers</text>

  <!-- bright room (high visibility) -->
  <rect x="370" y="100" width="180" height="170" rx="12" fill="none" stroke="#D97706" stroke-width="3"/>
  <circle cx="460" cy="160" r="24" fill="none" stroke="#FAFAF9" stroke-width="3.5"/>
  <g fill="#D97706">
    <circle cx="410" cy="225" r="6"/>
    <circle cx="435" cy="240" r="6"/>
    <circle cx="465" cy="230" r="6"/>
    <circle cx="495" cy="242" r="6"/>
    <circle cx="515" cy="222" r="6"/>
  </g>
  <text x="460" y="300" font-family="sans-serif" font-size="14" fill="#F59E0B" font-weight="600" text-anchor="middle">Full room</text>

  <!-- eye / visibility icon above, connecting the two -->
  <g stroke="#FAFAF9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M260 60 C310 20 370 20 420 60"/>
    <circle cx="340" cy="55" r="12"/>
  </g>
  <circle cx="340" cy="55" r="4" fill="#D97706"/>
</svg>
