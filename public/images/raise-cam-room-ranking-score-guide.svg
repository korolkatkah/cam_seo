<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How to raise your cam room ranking score legitimately — steady growth chart with trophy">
  <!-- baseline -->
  <line x1="90" y1="290" x2="560" y2="290" stroke="#292420" stroke-width="2"/>

  <!-- steady climb line -->
  <path d="M110 260 L190 245 L270 220 L350 195 L430 155 L500 120" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F59E0B">
    <circle cx="110" cy="260" r="5"/>
    <circle cx="190" cy="245" r="5"/>
    <circle cx="270" cy="220" r="5"/>
    <circle cx="350" cy="195" r="5"/>
    <circle cx="430" cy="155" r="5"/>
  </g>

  <!-- trophy at the top of the climb -->
  <g transform="translate(500,80)" stroke="#FAFAF9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-18 0 h36 v14 a18 18 0 0 1 -36 0 z"/>
    <path d="M-18 4 h-10 a10 10 0 0 0 10 16"/>
    <path d="M18 4 h10 a10 10 0 0 1 -10 16"/>
    <line x1="0" y1="32" x2="0" y2="44"/>
    <line x1="-14" y1="44" x2="14" y2="44"/>
  </g>
  <circle cx="500" cy="94" r="6" fill="#D97706"/>

  <!-- crossed-out bot icon, off to the side: not the method -->
  <g transform="translate(120,110)" stroke="#57534E" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-22" y="-14" width="44" height="34" rx="8"/>
    <circle cx="-9" cy="3" r="4"/>
    <circle cx="9" cy="3" r="4"/>
    <line x1="0" y1="-14" x2="0" y2="-26"/>
    <circle cx="0" cy="-30" r="3"/>
    <line x1="-22" y1="6" x2="-32" y2="6"/>
    <line x1="22" y1="6" x2="32" y2="6"/>
  </g>
  <line x1="96" y1="86" x2="144" y2="134" stroke="#78716C" stroke-width="3" stroke-linecap="round"/>
  <text x="120" y="160" font-family="sans-serif" font-size="13" fill="#57534E" text-anchor="middle">Not bots</text>

  <text x="500" y="270" font-family="sans-serif" font-size="14" fill="#F59E0B" font-weight="600" text-anchor="middle">Real growth</text>
</svg>
