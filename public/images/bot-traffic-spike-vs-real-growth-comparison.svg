<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparison chart: fake bot traffic spike and crash versus steady real audience growth">
  <line x1="60" y1="250" x2="580" y2="250" stroke="#292420" stroke-width="2"/>

  <!-- fake traffic: spike then crash, dashed -->
  <path d="M80 220 L160 200 L220 60 L280 210 L340 225 L400 230" fill="none" stroke="#78716C" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#78716C">
    <circle cx="220" cy="60" r="6"/>
  </g>
  <text x="220" y="42" font-family="sans-serif" font-size="13" fill="#78716C" font-weight="600" text-anchor="middle">Bot spike</text>
  <text x="340" y="248" font-family="sans-serif" font-size="12" fill="#57534E" text-anchor="middle" transform="translate(0,-4)"></text>
  <text x="345" y="215" font-family="sans-serif" font-size="12" fill="#57534E" text-anchor="middle">falls back</text>

  <!-- real growth: steady climb -->
  <path d="M80 235 L180 220 L280 195 L380 155 L480 110 L560 75" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#F59E0B">
    <circle cx="480" cy="110" r="6"/>
    <circle cx="560" cy="75" r="7"/>
  </g>
  <text x="500" y="55" font-family="sans-serif" font-size="13" fill="#F59E0B" font-weight="600" text-anchor="middle">Real audience</text>
</svg>
