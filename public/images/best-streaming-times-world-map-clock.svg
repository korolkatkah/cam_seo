<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Best streaming times by region — world map and peak viewer hours clock">
  <!-- world dots map (abstract) -->
  <g fill="#57534E" opacity="0.6">
    <circle cx="90" cy="140" r="4"/><circle cx="110" cy="150" r="4"/><circle cx="130" cy="145" r="4"/>
    <circle cx="150" cy="160" r="4"/><circle cx="170" cy="150" r="4"/><circle cx="200" cy="170" r="4"/>
    <circle cx="230" cy="160" r="4"/><circle cx="260" cy="175" r="4"/><circle cx="300" cy="165" r="4"/>
    <circle cx="330" cy="180" r="4"/><circle cx="370" cy="170" r="4"/><circle cx="400" cy="185" r="4"/>
    <circle cx="440" cy="175" r="4"/><circle cx="470" cy="190" r="4"/><circle cx="500" cy="180" r="4"/>
    <circle cx="530" cy="195" r="4"/><circle cx="120" cy="200" r="4"/><circle cx="180" cy="210" r="4"/>
    <circle cx="260" cy="220" r="4"/><circle cx="340" cy="215" r="4"/><circle cx="420" cy="225" r="4"/>
    <circle cx="490" cy="215" r="4"/>
