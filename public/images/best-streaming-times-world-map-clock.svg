  <circle cx="320" cy="270" r="55" fill="#1C1917" stroke="#A8A29E" stroke-width="3"/>
  <line x1="320" y1="270" x2="320" y2="235" stroke="#FAFAF9" stroke-width="4" stroke-linecap="round"/>
  <line x1="320" y1="270" x2="348" y2="285" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
  <circle cx="320" cy="270" r="4" fill="#FAFAF9"/>
  <g stroke="#57534E" stroke-width="2">
    <line x1="320" y1="219" x2="320" y2="227"/>
    <line x1="320" y1="313" x2="320" y2="321"/>
    <line x1="271" y1="270" x2="279" y2="270"/>
    <line x1="361" y1="270" x2="369" y2="270"/>
  </g>
</svg>
