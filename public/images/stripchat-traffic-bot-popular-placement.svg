<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Traffic bot placing a room into the Stripchat popular category, with a rising viewer graph">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="#0d1030"/>
  <circle cx="500" cy="90" r="160" fill="url(#glow)"/>

  <!-- rising bars: growing viewer/rank trend -->
  <g>
    <rect x="90" y="250" width="46" height="60" rx="6" fill="url(#barGrad)" opacity="0.35"/>
    <rect x="150" y="220" width="46" height="90" rx="6" fill="url(#barGrad)" opacity="0.55"/>
    <rect x="210" y="180" width="46" height="130" rx="6" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="270" y="120" width="46" height="190" rx="6" fill="url(#barGrad)"/>
  </g>

  <!-- trend line -->
  <polyline points="113,246 173,214 233,172 293,108" fill="none" stroke="#f0eeff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="293" cy="108" r="7" fill="#f0eeff"/>

  <!-- "Popular" category badge -->
  <rect x="360" y="70" width="220" height="56" rx="14" fill="#0d1030" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
  <circle cx="392" cy="98" r="6" fill="#34d399"/>
  <text x="412" y="103" font-family="sans-serif" font-size="17" font-weight="700" fill="#f0eeff">Popular · #3</text>

  <!-- room card -->
  <rect x="360" y="150" width="220" height="150" rx="16" fill="#0a0d24" stroke="#292b52" stroke-width="1.5"/>
  <rect x="378" y="168" width="184" height="90" rx="10" fill="#161a3d"/>
  <circle cx="398" cy="188" r="6" fill="#f43f5e"/>
  <text x="412" y="193" font-family="sans-serif" font-size="12" font-weight="700" fill="#fca5a5" letter-spacing="1">LIVE</text>
  <g fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <circle cx="470" cy="213" r="20"/>
    <path d="M470 203v20M460 213h20"/>
  </g>
  <g>
    <circle cx="390" cy="280" r="10" fill="#312e81"/>
    <circle cx="408" cy="280" r="10" fill="#4338ca"/>
    <circle cx="426" cy="280" r="10" fill="#6366f1"/>
    <text x="450" y="284" font-family="sans-serif" font-size="13" font-weight="700" fill="#a5b4fc">+482 viewers</text>
  </g>

  <!-- connecting arrow: promotion pushes room up -->
  <path d="M300 200 C 330 190, 335 175, 355 165" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M348 172 l10 -10 l4 13 z" fill="#a78bfa"/>

  <!-- base line -->
  <line x1="70" y1="312" x2="600" y2="312" stroke="#292b52" stroke-width="2"/>
</svg>
